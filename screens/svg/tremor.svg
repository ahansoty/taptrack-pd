<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"><title>tremor</title><rect width="320" height="240" fill="#F7F8FA"/><circle cx="19" cy="20" r="3.5" fill="#0F766E"/><text x="30" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#3E4C63" text-anchor="start" letter-spacing="1.1">TAPTRACK PD</text><text x="306" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5F6B80" text-anchor="end" letter-spacing="1.1">TEST 2 OF 4</text><rect x="14" y="34" width="292" height="1" fill="#D5DBE5"/><text x="16" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="600" fill="#132238" text-anchor="start" letter-spacing="-0.5">Hold still</text><text x="16" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3E4C63" text-anchor="start">Rest your arm. Keep the wrist calm.</text><rect x="16" y="150" width="288" height="26" fill="#EBEFF5"/><path d="M16,163 H304" fill="none" stroke="#132238" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M16,150 H304 M16,176 H304" fill="none" stroke="#D5DBE5" stroke-width="1"/><text x="304" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#5F6B80" text-anchor="end" letter-spacing="1.1">20 SECONDS</text><rect x="14" y="200" width="292" height="1" fill="#D5DBE5"/><rect x="27" y="224" width="10" height="10" fill="#948877"/><text x="32" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#3E4C63" text-anchor="middle" letter-spacing="1.1">STOP</text></svg>