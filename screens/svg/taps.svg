<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"><title>taps</title><rect width="320" height="240" fill="#F7F8FA"/><circle cx="19" cy="20" r="3.5" fill="#0F766E"/><text x="30" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#3E4C63" text-anchor="start" letter-spacing="1.1">TAPTRACK PD</text><text x="306" y="24" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5F6B80" text-anchor="end" letter-spacing="1.1">TEST 3 OF 4</text><rect x="14" y="34" width="292" height="1" fill="#D5DBE5"/><text x="16" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="600" fill="#132238" text-anchor="start" letter-spacing="-0.5">Tap yellow,</text><text x="16" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="600" fill="#132238" text-anchor="start" letter-spacing="-0.5">then green</text><text x="16" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3E4C63" text-anchor="start">Alternate, as fast as you can.</text><rect x="83" y="165" width="26" height="26" fill="#D4A21A"/><rect x="147" y="165" width="26" height="26" fill="#3E9461"/><text x="96" y="183" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F8FA" text-anchor="middle" letter-spacing="1.1">1</text><text x="160" y="183" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F8FA" text-anchor="middle" letter-spacing="1.1">2</text><path d="M118,178 H138" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M131,172 l7,6 l-7,6" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/><text x="304" y="183" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#5F6B80" text-anchor="end" letter-spacing="1.1">10 SECONDS</text><rect x="14" y="200" width="292" height="1" fill="#D5DBE5"/><rect x="27" y="224" width="10" height="10" fill="#948877"/><text x="32" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#3E4C63" text-anchor="middle" letter-spacing="1.1">STOP</text></svg>